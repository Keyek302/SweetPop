<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweet Pop</title>
<meta name="theme-color" content="#2a1650">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sweet Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#2a1650,#5b2a86 60%,#a23a8f);font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#hud{display:flex;gap:10px;width:var(--w);justify-content:space-between}
.card{flex:1;background:#ffffff22;border-radius:14px;padding:6px 4px;text-align:center;font-size:12px;opacity:.95}
.card b{display:block;font-size:20px}
#bar{width:var(--w);height:10px;background:#0004;border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff7a3d);transition:width .3s}
#b{position:relative;width:var(--w);height:var(--w);background:#0003;border-radius:16px;touch-action:none}
.t{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .28s cubic-bezier(.3,1.2,.6,1)}
.i{position:absolute;inset:7%;border-radius:32%;display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s;box-shadow:inset 0 -4px 0 #0003,inset 0 3px 0 #fff4}
.i::after{content:'';position:absolute;inset:0;border-radius:inherit}
.s1 .i::after{background:repeating-linear-gradient(0deg,#fffa 0 3px,transparent 3px 8px)}
.s2 .i::after{background:repeating-linear-gradient(90deg,#fffa 0 3px,transparent 3px 8px)}
.sel .i{transform:scale(1.15);outline:3px solid #fff}
#goal{font-size:13px;opacity:.9;width:var(--w);text-align:center}
#tools{display:flex;gap:10px}
#tools button{font-size:16px;font-weight:600;padding:8px 18px;border:0;border-radius:20px;background:#ffffff33;color:#fff}
.j{position:absolute;z-index:3;width:var(--s);height:var(--s);box-sizing:border-box;border-radius:12px;transition:opacity .35s,transform .35s;pointer-events:none}
.j::after{content:'';position:absolute;left:12%;top:8%;width:45%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-20deg)}
.j1{background:linear-gradient(145deg,rgba(255,80,190,.38),rgba(220,30,150,.26));box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),inset 0 -5px 8px rgba(150,0,100,.35)}
.j2{background:linear-gradient(145deg,rgba(255,60,180,.52),rgba(190,10,130,.4));box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),inset 0 -6px 10px rgba(120,0,80,.45),0 0 8px rgba(255,80,200,.7)}
.j0{opacity:0;transform:scale(1.25)}
.lk .i{outline:3px solid #e5e5e5;filter:saturate(.5)}
.lk .i::before{content:'🔒';position:absolute;right:-3px;top:-5px;font-size:.5em;z-index:2}
.hint .i{animation:pulse .45s infinite alternate}
@keyframes pulse{to{transform:scale(1.18);box-shadow:0 0 14px 4px #fff}}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nope .i{animation:nope .3s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#ov{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#ov h1{margin:0;font-size:34px}#ov p{margin:0;opacity:.85}
#ov button{font-size:20px;font-weight:700;padding:12px 32px;border:0;border-radius:30px;background:linear-gradient(#ffd84a,#ff9a3d);color:#4a1d00;margin-top:6px}
small{opacity:.6}
</style></head><body>
<div id="hud"><div class="card">Level<b id="lv">1</b></div><div class="card">Score<b id="sc">0</b></div><div class="card">Moves<b id="mv">0</b></div><div class="card">Best lvl<b id="bs">1</b></div></div>
<div id="bar"><i id="fill"></i></div>
<div id="goal"></div><div id="b"></div><div id="tools"><button id="hint">💡 Hint</button><button id="mute">🔊</button></div>
<small>Swipe or tap two neighbors. Match 4 = striped, 5 = 🍭 bomb. · v6</small>
<canvas id="fx"></canvas><div id="ov"><h1>🍬 Sweet Pop</h1><p>No ads. No paywalls. Ever.</p><button id="go">Play</button></div>
<script>
const N=8,K=['🍓','🍋','🍇','🍏','🍊','🫐'],C=['#e8344f','#f2c300','#8a3fd1','#3aa845','#f27a1a','#3a6ee8'];
let S,g=[],score=0,moves=0,level=1,target=0,busy=true,playing=false,sel=null,best=1,ps=null;
const B=document.getElementById('b'),$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
try{best=Math.max(1,+localStorage.getItem('sp-best')|0)}catch(e){}level=best;
let jel=[],jelEl=[],hintP=[],AC,mute=false,FP=[],fxOn=false,fxEnd=0;
const THEMES=['linear-gradient(160deg,#2a1650,#5b2a86 60%,#a23a8f)','linear-gradient(160deg,#0b2a4a,#145a8a 60%,#1fa3b8)','linear-gradient(160deg,#0e3321,#1f6b3a 60%,#7bb542)','linear-gradient(160deg,#4a1a0b,#a8401a 60%,#f2a03d)','linear-gradient(160deg,#4a0f2e,#a8245f 60%,#f06a8f)','linear-gradient(160deg,#3a0a0a,#8a1c1c 60%,#e0612a)'];
const fx=document.getElementById('fx'),fc=fx.getContext('2d');
function burst(x,y){const h=Math.random()*360|0;sfx.boom();for(let i=0;i<48;i++){const a=Math.PI*2*i/48+Math.random()*.2,v=2+Math.random()*4;FP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+Math.random()*40})}}
function fireworks(){fx.width=innerWidth;fx.height=innerHeight;fxEnd=performance.now()+4000;if(!fxOn){fxOn=true;fxLoop()}burst(innerWidth/2,innerHeight*.3);let n=0;const t=setInterval(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4));if(++n>=7)clearInterval(t)},450)}
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);for(const p of FP){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.011;fc.fillStyle=`hsla(${p.h},100%,60%,${Math.max(p.l,0)})`;fc.beginPath();fc.arc(p.x,p.y,2.4,0,7);fc.fill()}FP=FP.filter(p=>p.l>0);if(FP.length||performance.now()<fxEnd)requestAnimationFrame(fxLoop);else{fxOn=false;fc.clearRect(0,0,fx.width,fx.height)}}
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(mute||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
const sfx={swap:()=>tone(440,.08,'triangle',.12,200),bad:()=>tone(150,.2,'sawtooth',.1,-60),pop:c=>tone(380+Math.min(c,8)*70,.14,'sine',.18,260),lock:()=>tone(110,.18,'square',.1,-40),jelly:()=>tone(300,.15,'triangle',.14,-150),special:()=>[0,1,2,3].forEach(i=>tone(600+i*200,.15,'sine',.12,0,i*.06)),bomb:()=>tone(120,.5,'sawtooth',.14,600),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.16,0,i*.12)),lose:()=>[400,330,260].forEach((f,i)=>tone(f,.3,'sawtooth',.1,0,i*.18)),hint:()=>tone(880,.1,'sine',.1),boom:()=>{tone(80,.35,'sine',.22,-40);[0,1,2,3,4].forEach(i=>tone(1200+Math.random()*1500,.08,'square',.04,0,.1+i*.05))}};
function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
const jellyLeft=()=>jel.reduce((s,r)=>s+r.reduce((a,b)=>a+(b>0?1:0),0),0);
function drawJ(y,x){const e=jelEl[y][x];if(!e)return;const v=jel[y][x];e.className='j'+(v>=2?' j2':v==1?' j1':' j0')}
function setupJelly(){jel=Array.from({length:N},()=>Array(N).fill(0));jelEl=Array.from({length:N},()=>Array(N).fill(null));const cnt=level<2?0:Math.min(40,4+level*4),dbl=level>=5?Math.min(cnt>>1,level*2):0;let p=0;while(p<cnt){const y=Math.random()*N|0,x=Math.random()*N|0;for(const xx of[x,N-1-x]){if(!jel[y][xx]){jel[y][xx]=p<dbl?2:1;p++}}}
for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(jel[y][x]){const e=document.createElement('div');e.style.left=`calc(${x} * var(--s))`;e.style.top=`calc(${y} * var(--s))`;B.appendChild(e);jelEl[y][x]=e;drawJ(y,x)}}
function addLocks(){const c=level<3?0:Math.min(12,level-1);do{g.flat().forEach(o=>o.lock=0);let n=0;while(n<c){const y=1+Math.random()*(N-1)|0,x=Math.random()*N|0;const o=g[y][x];if(!o.lock){o.lock=1;n++}}}while(c&&!hasMoves())}
function findMove(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const[dy,dx]of[[0,1],[1,0]]){const y2=y+dy,x2=x+dx;if(y2>=N||x2>=N)continue;const a=g[y][x],b=g[y2][x2];if(a.lock||b.lock||jel[y][x]>0||jel[y2][x2]>0)continue;if(a.sp==3||b.sp==3)return[[y,x],[y2,x2]];g[y][x]=b;g[y2][x2]=a;const ok=findRuns().length>0;g[y2][x2]=b;g[y][x]=a;if(ok)return[[y,x],[y2,x2]]}return null}
const mk=(t,sp)=>({t:t==null?Math.random()*K.length|0:t,sp:sp||0,el:null});
const inb=p=>p[0]>=0&&p[0]<N&&p[1]>=0&&p[1]<N;
function size(){S=Math.floor(Math.min(innerWidth-24,innerHeight-300,480)/N);const w=S*N;const r=document.documentElement.style;r.setProperty('--w',w+'px');r.setProperty('--s',S+'px');B.style.fontSize=S*.55+'px'}
function paint(o){const e=o.el;e.className='t'+(o.sp==1?' s1':o.sp==2?' s2':'')+(sel&&g[sel[0]][sel[1]]===o?' sel':'')+(o.lock?' lk':'')+(hintP.includes(o)?' hint':'');const i=e.firstChild;i.textContent=o.sp==3?'🍭':K[o.t];i.style.background=o.sp==3?'conic-gradient(#f55,#fd3,#5d5,#3cf,#a5f,#f55)':C[o.t]}
function put(o,y,x){if(!o.el){o.el=document.createElement('div');o.el.innerHTML='<div class="i"></div>';B.appendChild(o.el);if(o.from!=null){o.el.style.transform=`translate(${x*S}px,${o.from*S}px)`;o.el.offsetWidth;delete o.from}}paint(o);o.el.style.transform=`translate(${x*S}px,${y*S}px)`}
function render(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x])put(g[y][x],y,x)}
function hud(){$('lv').textContent=level;$('sc').textContent=score;$('mv').textContent=moves;$('bs').textContent=best;$('fill').style.width=Math.min(100,score/target*100)+'%';const j=jellyLeft();$('goal').textContent=`Goal: ${target} pts`+(j?` + clear all jelly (${j} left)`:'')}
function findRuns(){const R=[];for(let y=0;y<N;y++){let x=0;while(x<N){const o=g[y][x];let k=x+1;if(o&&o.t>=0){while(k<N&&g[y][k]&&g[y][k].t==o.t)k++;if(k-x>=3)R.push({dir:'h',t:o.t,cells:Array.from({length:k-x},(_,j)=>[y,x+j])})}x=k}}
for(let x=0;x<N;x++){let y=0;while(y<N){const o=g[y][x];let k=y+1;if(o&&o.t>=0){while(k<N&&g[k][x]&&g[k][x].t==o.t)k++;if(k-y>=3)R.push({dir:'v',t:o.t,cells:Array.from({length:k-y},(_,j)=>[y+j,x])})}y=k}}return R}
function hasMoves(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(g[y][x].sp==3)return true;for(const[dy,dx]of[[0,1],[1,0]]){const y2=y+dy,x2=x+dx;if(y2>=N||x2>=N||g[y][x].lock||g[y2][x2].lock||jel[y][x]>0||jel[y2][x2]>0)continue;const a=g[y][x];g[y][x]=g[y2][x2];g[y2][x2]=a;const ok=findRuns().length>0;g[y2][x2]=g[y][x];g[y][x]=a;if(ok||g[y][x].sp==3||g[y2][x2].sp==3)return true}}return false}
async function clearSet(clr,combo){let n=0,lk=0,jl=0;for(const k of clr){const y=k/N|0,x=k%N,o=g[y][x];if(!o)continue;if(o.lock){o.lock=0;paint(o);lk++;continue}n++;o.el.firstChild.style.transform='scale(0)';o.el.firstChild.style.opacity=0;g[y][x]=null;setTimeout(()=>o.el.remove(),250);if(jel[y][x]>0){jel[y][x]--;jl++;drawJ(y,x)}}score+=n*10*combo+jl*30;sfx.pop(combo);if(lk)sfx.lock();if(jl)setTimeout(sfx.jelly,80);hud();await sleep(230);gravity();render();await sleep(320)}
function gravity(){for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--)if(g[y][x]){g[w][x]=g[y][x];if(w!=y)g[y][x]=null;w--}const n=w+1;for(let y=w;y>=0;y--){const o=mk();o.from=y-n;g[y][x]=o}}}
async function resolve(sw){let combo=0;for(;;){const runs=findRuns();if(!runs.length)break;combo++;const clr=new Set(),sp=[];
for(const r of runs){r.cells.forEach(([y,x])=>clr.add(y*N+x));if(r.cells.length>=4){const p=r.cells.find(c=>sw&&sw.some(s=>s[0]==c[0]&&s[1]==c[1]))||r.cells[r.cells.length>>1];sp.push({p,len:r.cells.length,dir:r.dir})}}sw=null;
const q=[...clr];for(let i=0;i<q.length;i++){const y=q[i]/N|0,x=q[i]%N,o=g[y][x];if(o&&(o.sp==1||o.sp==2))for(let j=0;j<N;j++){const kk=o.sp==1?y*N+j:j*N+x;if(!clr.has(kk)){clr.add(kk);q.push(kk)}}}
sp.forEach(s=>clr.delete(s.p[0]*N+s.p[1]));
await clearSet(clr,combo);
if(sp.length)sfx.special();sp.forEach(s=>{const o=g[s.p[0]][s.p[1]];if(!o)return;if(s.len>=5){o.t=-1;o.sp=3}else o.sp=s.dir=='h'?2:1;paint(o)})}}
async function swap(a,b){if(busy||!playing)return;hintP=[];const A=g[a[0]][a[1]],O=g[b[0]][b[1]];if(A.lock||O.lock||jel[a[0]][a[1]]>0||jel[b[0]][b[1]]>0){sel=null;sfx.bad();render();[A,O].forEach(o=>{o.el.classList.add('nope');setTimeout(()=>o.el.classList.remove('nope'),350)});return}busy=true;sel=null;g[a[0]][a[1]]=O;g[b[0]][b[1]]=A;sfx.swap();render();await sleep(260);
if(A.sp==3||O.sp==3){moves--;sfx.bomb();const tt=A.sp==3&&O.sp==3?-2:A.sp==3?O.t:A.t,clr=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const o=g[y][x];if(o&&(o.sp==3||tt==-2||o.t==tt))clr.add(y*N+x)}await clearSet(clr,2);await resolve(null)}
else if(!findRuns().length){sfx.bad();g[a[0]][a[1]]=A;g[b[0]][b[1]]=O;render();await sleep(260);busy=false;return}
else{moves--;hud();await resolve([a,b])}
hud();
if(score>=target&&jellyLeft()==0){playing=false;sfx.win();fireworks();if(level>=best){best=level+1;try{localStorage.setItem('sp-best',best)}catch(e){}}hud();ov(`Level ${level} clear! 🎉`,`Score ${score}`,'Next level',()=>{level++;start()})}
else if(moves<=0){playing=false;sfx.lose();ov('Out of moves 😵',`Score ${score} / ${target}`,'Try again',start)}
else{let n=0;while(!hasMoves()&&n++<50){for(const row of g)for(const o of row)if(o.sp!=3)o.t=Math.random()*K.length|0;let r;while((r=findRuns()).length){r.forEach(x=>{const[y,c]=x.cells[1];if(g[y][c].sp!=3)g[y][c].t=(g[y][c].t+1)%K.length})}render()}}
busy=false}
function ov(h,p,btn,fn){$('ov').innerHTML=`<h1>${h}</h1><p>${p}</p><button id="go">${btn}</button>`;$('ov').style.display='flex';$('go').onclick=fn}
function start(){$('ov').style.display='none';document.body.style.background=THEMES[((level-1)/10|0)%THEMES.length];B.innerHTML='';sel=null;hintP=[];score=0;target=900+level*300;setupJelly();moves=24+(jellyLeft()>>1);
do{g=Array.from({length:N},()=>Array.from({length:N},()=>mk()))}while(findRuns().length||!hasMoves());
for(let y=0;y<N;y++)for(let x=0;x<N;x++)g[y][x].from=y-N;addLocks();
size();render();hud();playing=true;busy=false}
function tap(r,c){if(busy||!inb([r,c]))return;hintP=[];if(!sel){if(jel[r][c]>0||g[r][c].lock){sfx.bad();const e=g[r][c].el;e.classList.add('nope');setTimeout(()=>e.classList.remove('nope'),350);return}sel=[r,c];render();return}
const d=Math.abs(sel[0]-r)+Math.abs(sel[1]-c);if(d==0){sel=null;render()}else if(d==1){const f=sel;sel=null;swap(f,[r,c])}else if(!(jel[r][c]>0||g[r][c].lock)){sel=[r,c];render()}}
B.addEventListener('pointerdown',e=>{if(busy||!playing)return;const r=B.getBoundingClientRect();ps={x:e.clientX,y:e.clientY,c:Math.floor((e.clientX-r.left)/S),r:Math.floor((e.clientY-r.top)/S)}});
B.addEventListener('pointermove',e=>{if(!ps||busy)return;const dx=e.clientX-ps.x,dy=e.clientY-ps.y;if(Math.max(Math.abs(dx),Math.abs(dy))>S*.4){const f=[ps.r,ps.c],t=Math.abs(dx)>Math.abs(dy)?[ps.r,ps.c+Math.sign(dx)]:[ps.r+Math.sign(dy),ps.c];ps=null;if(inb(f)&&inb(t))swap(f,t)}});
addEventListener('pointerup',()=>{if(!ps)return;const p=ps;ps=null;tap(p.r,p.c)});
addEventListener('resize',()=>{size();if(g.length)render()});
addEventListener('pointerdown',initAudio);
$('hint').onclick=()=>{if(busy||!playing)return;const m=findMove();if(!m)return;sel=null;hintP=[g[m[0][0]][m[0][1]],g[m[1][0]][m[1][1]]];sfx.hint();render()};
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
size();hud();$('go').onclick=start;
if(level>1){$('go').textContent='Continue: Level '+level;const b=document.createElement('button');b.textContent='New game';b.style.cssText='font-size:14px;background:#ffffff33;color:#fff;padding:8px 20px;margin-top:0';b.onclick=()=>{if(confirm('Reset your progress back to level 1?')){best=1;level=1;try{localStorage.removeItem('sp-best')}catch(e){}start()}};$('ov').appendChild(b)}
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0){const had=navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__r){window.__r=1;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
